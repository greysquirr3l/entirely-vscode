name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A workflow is code too, and a broken one fails the release rather
      # than the build. The image is pinned to a digest, so what runs is
      # what was reviewed.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      # The type check and the linter run as part of the build rather
      # than as steps of their own, so a change that does not compile
      # cannot pass even when the tests happen to.
      - name: Compile
        run: npm run compile

      # The tests run in a real editor, which needs a display. The
      # runner has no screen of its own, so a virtual one is provided.
      - name: Run the extension-host tests
        run: xvfb-run --auto-servernum npm test

      # The package is built here rather than only at release time, so a
      # change that breaks the packaging is caught while it is being
      # made rather than when it is being published.
      - name: Build the package
        run: npx vsce package --no-git-tag-version --allow-missing-repository

      - name: Check the package contents
        run: npm run package:check

  # The extension reads the CLI rather than re-implementing it, so the
  # CLI's shape is the extension's contract. This job installs the CLI
  # and checks that it still answers the way the extension expects —
  # before a user finds out that it does not.
  #
  # It needs no account and no network: `entire agent-help` describes a
  # command from the binary itself. The version is pinned so that a
  # change in the CLI is a deliberate bump rather than a surprise.
  cli-contract:
    name: Check the Entire CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The CLI is installed from its own release, at the version the
      # extension declares it expects. The install script is fetched
      # over HTTPS and run, so what is installed is what the release
      # published.
      - name: Install the Entire CLI
        run: |
          curl -sSfL https://entire.com/install.sh -o /tmp/entire-install.sh
          sh /tmp/entire-install.sh --version 0.12.2
          entire version

      - name: Check the CLI contract
        run: npm run check:cli
