[[phases.tasks]]
slug      = "checkpoint-history"
kind      = "feature"
title     = "Checkpoint list and diff viewer"
goal      = "Make recorded checkpoints browsable from the editor and openable in the native diff editor."
depends_on = ["domain-types"]
hints = [
