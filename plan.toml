# ─── Phase 4: Agent Integration ───────────────────────────────────────────────

[[phases]]
name  = "Agent Integration"
order = 4

[[phases.tasks]]
slug      = "hook-bridge"
kind      = "feature"
title     = "Copilot CLI hook bridge"
goal      = "Report the extension's own agent activity to Entire using the same hook protocol the CLI installs for Copilot CLI, so editor work lands in the same session history."
depends_on = ["domain-types"]
hints = [
    "The protocol is `entire hooks copilot-cli <event>` with the event payload as JSON on stdin; the CLI writes the result, not the caller.",
    "The nine events are SessionStart, UserPromptSubmitted, PreToolUse, PostToolUse, SubagentStart, SubagentStop, SessionEnd, AgentStop and ErrorOccurred.",
    "The payload carries at least `session_id`, `cwd`, `source` and `hook_event_name`; prompts and tool inputs are optional.",
    "The CLI's own installed hooks guard on `command -v entire` and exit 0 when it is missing. The extension must behave the same way: never surface a hook failure to the user.",
    "Delivery must not block the editor. Fire and forget, and never await a hook before completing the user action that triggered it.",
    "The extension's session id must be stable for the lifetime of a workspace session so that a turn's Pre and Post events pair up.",
    "If the user has the CLI's own Copilot CLI hooks installed, the extension must not double-report: detect the installed hook file and stand down.",
]
test_hints = [
    "A test that each editor event maps to the correct hook subcommand and payload.",
    "A test that a missing CLI results in a silent no-op and no error surfaced.",
    "A test that the bridge stands down when `.github/hooks/entire.json` is present.",
    "A test that hook delivery does not delay the triggering action.",
]
must_haves = [
    "All nine hook events are mapped to the correct CLI subcommand",
    "Payloads carry session_id, cwd, source and hook_event_name",
    "A missing or failing CLI never surfaces an error to the user",
    "The bridge stands down when the CLI's own Copilot CLI hooks are installed",
]
evaluation_criteria = [
    "Each of the nine events invokes the matching `entire hooks copilot-cli` subcommand with JSON on stdin",
    "No hook failure is surfaced as a user-visible error",
    "Hook delivery does not block the triggering editor action",
    "The bridge is inert when `.github/hooks/entire.json` already exists",
]
implements = ["agent-hooks"]

[[phases.tasks]]
slug      = "why-this-line"
kind      = "feature"
title     = "Why does this line exist"
goal      = "Answer the question a reviewer actually asks - who changed this line, and why - without leaving the editor."
depends_on = ["domain-types"]
hints = [
    "Use Entire's own `why` command so the answer is consistent with the CLI and the web UI; do not re-derive history from the Git log.",
    "The command is `entire why <file>[:line] [--line N] [--json]`. Pass the relative path and the line number; `--json` is what the extension should always use.",
    "The JSON has TWO shapes and the difference matters: a single line gives `{ file, line: {...} }` with `line` singular, while a whole file gives `{ file, lines: [...], summary: {...} }` with `lines` plural. Decode both.",
    "The whole-file form's `summary` block gives `total_lines`, `checkpoint_lines`, `commit_lines`, `uncommitted_lines`, `checkpoint_percentage` and `commit_percentage` - a distribution worth rendering as a small bar.",
    "Each line entry carries `line_number`, `status`, `commit_sha`, `short_commit_sha`, `author`, `author_time` and `content`.",
    "`status` is one of `commit`, `checkpoint` or `uncommitted` - the three things a line can be attributed to.",
    "A checkpoint-attributed line carries four more: `checkpoint_id`, `metadata_missing`, `metadata_missing_reason` and a `candidates` array. The candidate list is how the CLI expresses ambiguity - more than one checkpoint could own the line.",
    "`metadata_missing: true` with a `metadata_missing_reason` is the NORMAL state when the checkpoint body is not available locally: the CLI has the commit but not the checkpoint. Show that state; do not treat it as an error.",
    "`entire checkpoint explain <id-or-sha> --json` gives the full story for a checkpoint, including its session and prompt. Use it as the drill-down from a checkpoint-attributed line.",
    "Render the result in a side panel or a well-formed notification, showing the originating session, checkpoint and agent when the CLI returns them.",
    "When the line is unattributed, say so plainly - a confident wrong answer is worse than an honest none.",
    "Offer a command palette entry and an editor context-menu entry, both operating on the current selection or cursor line.",
    "For the whole-file form, the `summary` block gives `total_lines`, `checkpoint_lines`, `commit_lines`, `uncommitted_lines` and the two percentages - a useful thing to render as a small distribution bar.",
]
test_hints = [
    "A test that the why command invokes the CLI with the cursor line as the subject.",
    "A test that an unattributed line produces an explicit 'not attributed' message.",
    "A test that the command is available from both the palette and the context menu.",
]
must_haves = [
    "The explanation comes from Entire's own why command",
    "The originating session, checkpoint and agent are shown when available",
    "An unattributed line is reported as such rather than guessed at",
    "The command is reachable from the palette and the editor context menu",
]
evaluation_criteria = [
    "The why command shells out to the CLI rather than reading Git history directly",
    "The result names the session, checkpoint and agent when the CLI supplies them",
    "An unattributed line yields an explicit statement, not a guess",
    "The command appears in both the palette and the editor context menu",
]
implements = ["why-this-line"]

# ─── Phase 5: Polish and Release ──────────────────────────────────────────────

[[phases]]
name  = "Polish and Release"
order = 5

[[phases.tasks]]
slug      = "settings-and-config"
kind      = "feature"
title     = "Configuration surface and settings-driven behaviour"
goal      = "Expose the behaviour a user may reasonably want to change as VS Code settings, and make the extension read Entire's own layered configuration where it matters."
depends_on = ["status-bar", "session-tree"]
hints = [
    "Entire's settings are layered: `.entire/settings.local.json`, `.entire/settings.json`, `~/.config/entire/settings.json`, then defaults. The extension should surface the effective value of the settings it acts on.",
    "The settings the CLI understands include enabled, log_level, checkpoints.primary.type, telemetry, absolute_git_hook_path, commit_linking, sign_checkpoint_commits, and strategy_options.*.",
    "Give the extension its own settings for the things the CLI does not cover: the CLI path, the refresh interval, whether to show the session view in the explorer, and the log level for the extension's own output channel.",
    "A setting must be documented in package.json with a description and a sensible default - an undocumented setting is a hidden setting.",
    "Changing a setting must take effect without requiring a window reload.",
]
test_hints = [
    "A test that each setting is declared in package.json and registered with the configuration API.",
    "A test that changing the CLI path setting re-resolves the CLI.",
    "A test that the effective Entire setting is read from the layered locations in the documented precedence order.",
]
must_haves = [
    "Every extension setting is declared in package.json with a description and a default",
    "Settings changes take effect without a window reload",
    "The effective Entire setting is resolved through the documented layering",
    "The extension can point at a specific CLI binary",
]
evaluation_criteria = [
    "Each contributed configuration property has a description and a default value",
    "Changing the CLI path setting causes the extension to re-resolve the binary",
    "Effective settings are resolved in the order local, project, global, defaults",
    "No setting is read without being declared in package.json",
]

[[phases.tasks]]
slug      = "output-and-diagnostics"
kind      = "feature"
title     = "Output channel, diagnostics and the doctor command"
goal      = "Make the extension debuggable: one output channel for everything it does, and a doctor command that answers 'why is this not working?'."
depends_on = ["cli-process", "status-bar"]
hints = [
    "One output channel, named 'Entire', for CLI invocations, their exit codes, and the errors that were swallowed.",
    "Log the exact command line and the working directory for each CLI invocation - that is what a user needs to reproduce a problem.",
    "Do not log full checkpoint payloads or prompt bodies by default; log their size and a truncation instead, and provide an explicit command to dump the detail.",
    "A `doctor` command that reports: CLI path and version, whether the workspace is a repository, whether Entire is enabled, the effective settings, and the last CLI error.",
    "Doctor output should be copyable - a user will paste it into an issue.",
    "Respect a debug setting that raises the log level without needing a separate channel.",
]
test_hints = [
    "A test that each CLI invocation writes its command line and exit code to the channel.",
    "A test that the doctor command reports the CLI version and the workspace state.",
    "A test that prompt bodies are not written to the channel at the default log level.",
]
must_haves = [
    "A single output channel carries every CLI invocation and its exit code",
    "The doctor command reports CLI version, repository state, enablement and effective settings",
    "Prompt bodies and checkpoint payloads are not logged at the default level",
    "Doctor output is copyable in one action",
]
evaluation_criteria = [
    "Every CLI invocation appears in the output channel with its command line and exit code",
    "The doctor command produces a complete, copyable diagnostic report",
    "No prompt body appears in the channel at the default log level",
    "The channel is disposed through context.subscriptions",
]

[[phases.tasks]]
slug      = "packaging-and-release"
kind      = "infrastructure"
title     = "Marketplace packaging, CI and release workflow"
goal      = "Make the extension installable, publishable and continuously verified - the difference between a project and a top-tier extension."
depends_on = ["settings-and-config", "output-and-diagnostics"]
hints = [
    "A GitHub Actions workflow that builds, lints, type-checks and tests the extension on every push, and packages a .vsix on release.",
    "The package script must run the type check and the linter before bundling - a published extension that does not compile is worse than no release.",
    "Use a secret-backed publish step with `vsce publish` for the marketplace, and publish to Open VSX as well so the extension is installable outside the Microsoft marketplace.",
    "Include a CHANGELOG with Keep a Changelog structure and a README that leads with what the extension does, not with how to build it.",
    "Include screenshots or a short GIF in the marketplace listing, and set the correct categories, keywords and support links.",
    "Add a LICENSE file and the `repository`, `bugs` and `homepage` fields.",
    "Version the extension with SemVer and keep the changelog in step with the releases.",
]
test_hints = [
    "CI must pass on a clean checkout: type check, lint, unit tests and the extension-host smoke test.",
    "The packaging job must produce a .vsix that installs into a clean VS Code instance.",
    "The published package must contain no source maps of test files, no tests, and no development dependencies.",
]
must_haves = [
    "A CI workflow that type-checks, lints and tests on every push",
    "A release workflow that publishes to the Visual Studio Marketplace and to Open VSX",
    "CHANGELOG.md follows Keep a Changelog and the README leads with the feature",
    "LICENSE, repository, bugs and homepage are set in package.json",
]
evaluation_criteria = [
    "CI runs the type check, the linter and the test suite and all three pass",
    "The release job publishes a .vsix to both marketplaces",
    "The published .vsix contains no test files and no development dependencies",
    "The README's first screen explains what the extension does for a user",
]

# ─── Phase 6: Hardening ───────────────────────────────────────────────────────

[[phases]]
name  = "Hardening"
order = 6

[[phases.tasks]]
slug      = "security-hardening"
kind      = "audit"
title     = "Security and privacy review of the extension"
goal      = "Audit the extension for the ways it can leak data, run something it should not, or degrade a user's machine — and fix what the audit finds."
depends_on = ["hook-bridge", "settings-and-config"]
hints = [
    "The extension shells out to a CLI. Every argument must be passed as a separate argv element, never concatenated into a shell string — a filename with a space or a quote in it must not become shell syntax.",
    "The extension reads `.entire/settings.json` and other user files. Validate their shape before use; a malformed settings file must not crash the extension.",
    "Entire writes session data that includes agent transcripts and, potentially, source code. The extension must not copy that data anywhere outside the machine the CLI put it on.",
    "The extension must not add telemetry of its own, and must not read the Entire access token to do anything other than pass it to the CLI.",
    "The CLI's own redaction is best-effort, not a guarantee. The extension must not surface prompt or transcript content in a place a user did not ask for it — no status bar tooltip, no notification body.",
    "Respect the CLI's `telemetry` setting: if it is off, the extension must not attempt any network call of its own.",
    "The output channel is a local buffer, but it can be attached to a bug report. It must not contain secret material by default.",
]
test_hints = [
    "A test that a filename containing a space, a quote or a semicolon is passed through as a single argv element and never interpreted.",
    "A test that a malformed `.entire/settings.json` is ignored rather than thrown from.",
    "A test that the output channel does not contain prompt bodies or token material at the default log level.",
]
must_haves = [
    "No CLI argument is ever built by string concatenation into a shell command",
    "User-supplied file contents are validated before use",
    "No access token is read except to hand it to the CLI",
    "The extension makes no network request of its own",
    "No prompt or transcript content appears in a status bar, tooltip or notification body",
]
evaluation_criteria = [
    "Every child_process invocation passes arguments as an argv array, never a shell string",
    "A path or filename containing shell metacharacters is handled safely",
    "The extension contains no network client and no access-token handling of its own",
    "A test proves prompt content never reaches the output channel at the default log level",
]

[[phases.tasks]]
slug      = "integration-wiring"
kind      = "audit"
title     = "End-to-end wiring audit"
goal      = "Prove that every command, provider, setting and disposable the manifest advertises is actually connected — and that the extension works as a whole, not just as parts."
depends_on = ["security-hardening", "packaging-and-release"]
hints = [
    "Enumerate every command in package.json and assert each one is registered at activation. An advertised command that does nothing is worse than an absent one.",
    "Assert every disposable is pushed onto context.subscriptions, and that deactivating the extension leaves no listener behind.",
    "Assert every setting the code reads is declared in package.json, and every setting declared is actually read.",
    "Assert the tree view provider, the status bar item and the output channel are all created and all disposed.",
    "Check that no module imports `vscode` from `src/lib/` — that layer must stay testable without an extension host.",
    "Look for the AI-generated tells: a `TODO`, a `throw new Error('not implemented')`, a function that returns a hardcoded value, a catch block that swallows an error silently.",
    "Run the extension in a real extension host against a real Git workspace with the CLI present, and confirm the status bar, the tree and a checkpoint diff all work.",
]
test_hints = [
    "A test that iterates package.json's contributed commands and asserts each is registered.",
    "A test that asserts every disposable lands in context.subscriptions.",
    "A test that scans src/lib/ for `vscode` imports.",
    "An extension-host test that opens a workspace, activates the extension, and asserts the tree has children.",
]
must_haves = [
    "Every contributed command is registered",
    "Every disposable is pushed onto context.subscriptions",
    "Every setting read by the code is declared in package.json and vice versa",
    "No module under src/lib/ imports vscode",
    "No placeholder or stub implementation remains",
]
evaluation_criteria = [
    "A test asserts every command in package.json is registered and every registered command exists in package.json",
    "A test asserts no disposable is leaked",
    "The extension-host test activates the extension in a real workspace and observes working UI",
    "A scan finds no TODO, no unimplemented branch and no silently swallowed error",
]

[[phases.tasks]]
slug      = "stub-cleanup"
kind      = "audit"
title     = "Remove scaffold leftovers and placeholder code"
goal      = "Delete everything the generator left behind — the hello-world command, the sample test, the template description — so nothing in the published extension is scaffolding."
depends_on = ["integration-wiring"]
hints = [
    "The generator leaves a `greysquirr3l.entirely.helloWorld` command and a `src/test/extension.test.ts` that only asserts the hello world. Both must go, and the manifest must not reference them.",
    "The generator's README is a quickstart template. Replace it with a real README that leads with what the extension does.",
    "The generator's CHANGELOG is a one-line placeholder. Replace it with a real Keep a Changelog entry for 0.1.0.",
    "Remove `vsc-extension-quickstart.md` from the published package.",
    "Search the whole source tree for `TODO`, `FIXME`, `XXX`, `placeholder`, `stub` and `not implemented` and resolve every hit — either by implementing it or by deleting it.",
    "Check the icon and gallery assets: a missing or placeholder icon makes the marketplace listing look unfinished.",
]
test_hints = [
    "A test that asserts the hello-world command is absent from the manifest and unregistered.",
    "A test that scans the source tree for placeholder markers and fails if any are found.",
    "A test that asserts the packaged .vsix contains no quickstart file.",
]
must_haves = [
    "The hello-world command and its sample test are gone",
    "The README and CHANGELOG are real documents, not generator templates",
    "The published package contains no quickstart file",
    "No TODO, FIXME or placeholder marker survives anywhere in src/",
]
evaluation_criteria = [
    "package.json contains no hello-world command and the extension registers no such command",
    "A source scan finds no TODO, FIXME or placeholder marker",
    "The packaged .vsix contains no generator template files",
    "The README and CHANGELOG describe the actual extension",
]
