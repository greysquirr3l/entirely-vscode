# plan.toml — entirely: a VS Code extension for Entire
#
# Entire is a Git forge for agent-human collaboration. It records what coding
# agents did as *sessions*, freezes them into *checkpoints*, and shares the
# history across a team. The CLI does the work; this extension is the
# editor-side surface for it.
#
# This plan is based on the installed CLI (v0.12.2), whose integration surface
# was recovered by installing it and exercising every command. The recovered
# surface is documented in research/CLI-SURFACE.md.
#
#   wiggum validate plan.toml
#   wiggum generate plan.toml --dry-run
#   wiggum generate plan.toml

# ─── Project ──────────────────────────────────────────────────────────────────

[project]
name        = "entirely"
description = """
Entirely is a Visual Studio Code extension for Entire, a Git forge built for
agent-human collaboration.

Entire's CLI records each coding-agent session, freezes it into a checkpoint,
and publishes the history so a team can see what every agent did and why. The
CLI is a terminal tool; everything it exposes is invisible from the editor.
Entirely surfaces it: a status bar that always knows whether the current
workspace is tracking, a tree of live sessions, checkpoint history that opens
straight into the diff, the ability to start a tracked agent turn from the
editor, and an inline blame-style "why does this line exist" query.

The extension never re-implements Entire. It discovers the installed CLI,
reads its JSON output, and shells out for anything mutating. If the CLI is
missing, the extension degrades to a clear, actionable message rather than
failing obscurely.
"""
language     = "typescript"
path         = "/Users/ncampbell/Projects/vscode-plugins/entirely"
architecture = "layered"

# ─── Preflight ────────────────────────────────────────────────────────────────

[preflight]
build = "npm run compile"
test  = "npm test"
lint  = "npm run lint"

# ─── Orchestrator ─────────────────────────────────────────────────────────────

[orchestrator]
persona     = "You are a senior TypeScript engineer building a production-grade VS Code extension."
strategy    = "standard"
max_retries = 2
on_failure  = "pause"
require_evaluator = true
gates = []
rules = [
    "TypeScript strict mode is already on. Do not weaken it, and do not add `any` to make a type error go away — model the shape instead.",
    "Keep `src/lib/` free of any `vscode` import. Everything there is plain TypeScript and must be unit-testable without an extension host.",
    "The `vscode` module may only be imported from `src/extension.ts`, `src/commands/`, `src/providers/`, and `src/services/`.",
    "Every command, provider, watcher, and disposable must be pushed onto `context.subscriptions`. A leaked listener is the number-one extension bug.",
    "The Entire CLI is the source of truth for its own behaviour. Never hardcode a flag list — read `entire agent-help <command>` at runtime instead.",
    "The CLI may be missing, old, or on a machine where it is not on PATH. Every code path that touches the CLI must handle absence explicitly.",
    "No `entire` invocation may block the extension host for more than a second without yielding to the event loop.",
    "Never log a full checkpoint payload or a prompt body to the output channel by default; offer it behind an explicit command instead.",
    "Follow the extension's own style: no `any`, no non-null assertions on values the CLI could omit, no floating promises.",
    "Prefer declaring a VS Code setting over hardcoding a value. Anything a user may reasonably want to change needs a setting with a sensible default.",
]
# ─── Evaluator ────────────────────────────────────────────────────────────────
# Weighted, plan-level criteria. Every task's own `evaluation_criteria` are
# checked against these; the weights sum to 100.

[evaluator]
persona        = "You are a meticulous staff engineer reviewing a VS Code extension. You verify behaviour against the stated criteria by reading the code and running the checks, not by trusting the implementer's summary."
pass_threshold = 8
hard_fail      = true
test_tool      = "npm test"
mode           = "blocking"
contract_review = true

[[evaluator.criteria]]
name        = "type-safety"
weight      = 20
description = "No `any` and no unjustified non-null assertions. The CLI's nullable fields are modelled as nullable, and every decoder handles a malformed payload without throwing."
[[evaluator.criteria]]
name        = "correctness"
weight      = 25
description = "The implementation matches the recovered CLI behaviour: the right subcommand, the right JSON shape, the right hook event. Behaviour that was verified against the real CLI stays faithful."
[[evaluator.criteria]]
name        = "failure-handling"
weight      = 20
description = "Every path that touches the CLI handles its absence, its failure and its timeout. A missing CLI is a normal state that degrades quietly, never an unhandled error."
[[evaluator.criteria]]
name        = "tests"
weight      = 20
description = "Each task's behaviour is covered by a test that would fail if the behaviour regressed. Tests assert observable outcomes, not implementation details."
[[evaluator.criteria]]
name        = "extension-craft"
weight      = 15
description = "Disposables are pushed onto context.subscriptions, commands are registered with correct titles and icons, settings are declared in package.json, and no operation blocks the extension host."

# ─── Capabilities ─────────────────────────────────────────────────────────────

[[capabilities]]
name        = "cli-discovery"
title       = "Entire CLI Discovery"
description = "Locates the installed Entire CLI, verifies it can run, and reports its version - without ever blocking or crashing when it is absent."
requirements = [
    "MUST locate the `entire` binary by checking PATH first, then the documented install locations, and MUST record which one was used.",
    "MUST distinguish 'not installed' from 'installed but broken' and MUST surface the distinction in the UI.",
    "MUST never throw out of discovery; a missing CLI is an expected state, not an error.",
]
[[capabilities.scenarios]]
name = "cli-on-path"
when = "the `entire` binary is on PATH and `entire version` exits zero"
then = "discovery reports the CLI as available with its version string"
[[capabilities.scenarios]]
name = "cli-absent"
when = "no `entire` binary is found on PATH or in any known install location"
then = "discovery reports the CLI as absent and the extension shows an actionable install prompt instead of failing"
[[capabilities.scenarios]]
name = "cli-present-but-broken"
when = "an `entire` binary is found but `entire version` exits non-zero or prints unparseable output"
then = "discovery reports the CLI as present but unusable, and the error detail is available for diagnosis"

[[capabilities]]
name        = "workspace-tracking-status"
title       = "Workspace Tracking Status"
description = "Knows, at all times, whether the current workspace is tracked by Entire, which agents are integrated, and which session is live."
requirements = [
    "MUST read tracking state from `entire status --json` and MUST parse it defensively, because the JSON carries nullable fields when the workspace is not a repository.",
    "MUST surface tracking state in the status bar with a distinct visual treatment for tracked, untracked, and error states.",
    "MUST refresh when the user switches workspaces, when the Git HEAD changes, and when an agent hook fires.",
]
[[capabilities.scenarios]]
name = "tracked-workspace"
when = "the workspace is a Git repository with Entire enabled"
then = "the status bar shows the tracked state together with the active session when one exists"
[[capabilities.scenarios]]
name = "untracked-workspace"
when = "the workspace is a Git repository but Entire is not enabled for it"
then = "the status bar offers an enable action rather than showing an error"
[[capabilities.scenarios]]
name = "not-a-repository"
when = "the workspace is not a Git repository"
then = "the status bar shows an inert state and no enable action is offered"

[[capabilities]]
name        = "session-tree"
title       = "Session Explorer"
description = "Shows every session Entire tracks for the current repository, live and finished, and opens a session's detail on demand."
requirements = [
    "MUST source sessions from `entire session list --json`, which returns worktree paths across the whole repository rather than only the open folder.",
    "MUST show, per session, the agent, its status, the branch, the turn and checkpoint counts, and the last prompt.",
    "MUST refresh the tree when a session's status changes, and MUST NOT poll more often than the refresh interval allows.",
]
[[capabilities.scenarios]]
name = "list-sessions"
when = "the user opens the Entire view in a tracked repository"
then = "the tree lists each tracked session with its agent, status, branch and counts"
[[capabilities.scenarios]]
name = "session-detail"
when = "the user selects a session"
then = "the session's details are shown, including its last prompt and its checkpoint count"
[[capabilities.scenarios]]
name = "empty-repository"
when = "the repository has no tracked sessions"
then = "the tree shows an empty-state message that explains how sessions get recorded"

[[capabilities]]
name        = "checkpoint-history"
title       = "Checkpoint History"
description = "Lists the checkpoints recorded on the current branch and opens any checkpoint in the diff editor."
requirements = [
    "MUST source checkpoints from `entire checkpoint list --json`.",
    "MUST open a checkpoint's diff using the native VS Code diff editor rather than a custom view.",
    "MUST tolerate a checkpoint whose diff is unavailable, showing an explanation instead of an error toast.",
]
[[capabilities.scenarios]]
name = "list-checkpoints"
when = "the user opens the checkpoint list in a tracked repository"
then = "each recorded checkpoint is listed with its message, author and time"
[[capabilities.scenarios]]
name = "open-checkpoint"
when = "the user selects a checkpoint"
then = "the checkpoint's changes open in the diff editor"
[[capabilities.scenarios]]
name = "checkpoint-without-diff"
when = "a checkpoint has no retrievable diff"
then = "the extension explains that the diff is unavailable and does not open an empty diff"

[[capabilities]]
name        = "agent-hooks"
title       = "Agent Hook Bridge"
description = "Reports editor-side agent activity to Entire so the editor's own work is captured in the same session history as the CLI's."
requirements = [
    "MUST speak the Copilot CLI hook protocol by invoking `entire hooks copilot-cli <event>` with the event payload as JSON on stdin.",
    "MUST map editor events onto the nine Copilot CLI hook events: SessionStart, UserPromptSubmitted, PreToolUse, PostToolUse, SubagentStart, SubagentStop, SessionEnd, AgentStop and ErrorOccurred.",
    "MUST preserve the CLI's own convention that a missing `entire` binary is a silent no-op, and MUST NOT surface hook failures as user-visible errors.",
    "MUST NOT block the editor on hook delivery; a hook that has not completed MUST never delay a user action.",
]
[[capabilities.scenarios]]
name = "session-start"
when = "the extension activates in a tracked workspace"
then = "a SessionStart hook is delivered carrying the session identifier and workspace path"
[[capabilities.scenarios]]
name = "tool-use"
when = "the user invokes a file-editing tool through the extension"
then = "a PreToolUse and a matching PostToolUse hook are delivered for that invocation"
[[capabilities.scenarios]]
name = "cli-absent"
when = "the `entire` binary cannot be found"
then = "hook delivery is a silent no-op and the editor behaves exactly as if the bridge were not present"

[[capabilities]]
name        = "why-this-line"
title       = "Why Does This Line Exist"
description = "Answers, for the cursor's line, which agent edit introduced it and why."
requirements = [
    "MUST use Entire's own `why` command to answer, so the answer matches the CLI and the web UI rather than re-deriving history locally.",
    "MUST present the answer with the originating session and checkpoint when the CLI supplies them.",
]
[[capabilities.scenarios]]
name = "explain-line"
when = "the user runs the why-this-line command with the cursor on a changed line"
then = "the originating agent, session and explanation are shown"
[[capabilities.scenarios]]
name = "unexplained-line"
when = "Entire has no record of the line under the cursor"
then = "the extension says the line is not attributed to any recorded change"

# ─── Phase 1: Foundations ─────────────────────────────────────────────────────

[[phases]]
name  = "Foundations"
order = 1

[[phases.tasks]]
slug      = "project-scaffold"
kind      = "infrastructure"
title     = "Extension manifest, build pipeline, and repository hygiene"
goal      = "Turn the generated scaffold into the manifest, build, lint and test setup the real extension will live in, with the contributed surface declared but not yet implemented."
depends_on = []
hints = [
    "Set `engines.vscode` to the lowest version the implementation actually needs, and keep `@types/vscode` at or below it.",
    "Use auto-generated activation events (`contributes.commands` plus implied `onCommand` activation) rather than a hand-maintained `activationEvents` array.",
    "Declare the extension's contributed surface: a status bar item, a tree view container, a configuration section, and the command palette entries.",
    "Add `extensionKind` so the extension runs on the workspace side in Remote SSH, Containers and WSL.",
    "Set the repository, publisher, license, icon and categories fields - the marketplace listing is part of a top-tier extension.",
    "Add a `prepublishOnly` script and a `.vscodeignore` that keeps sources and tests out of the published package.",
    "Install dependencies and make sure `npm run compile`, `npm run lint` and `npm test` all work on a clean checkout.",
]
test_hints = [
    "A smoke test that activates the extension and asserts the contributed commands are registered.",
    "The packaged `.vsix` must contain `dist/extension.js` and must not contain `src/` or `out/`.",
]
must_haves = [
    "package.json declares the status bar item, tree view, configuration section and commands",
    "engines.vscode and @types/vscode are consistent with each other",
    "npm run compile, npm run lint and npm test pass on a clean checkout",
    "The .vsix excludes src/, out/ and node_modules dev artifacts",
]
evaluation_criteria = [
    "npm run compile produces dist/extension.js with no TypeScript errors",
    "npm run lint reports zero problems",
    "npm test passes in the extension host",
    "package.json contributes a status bar item, a tree view, and a configuration section",
]

[[phases.tasks]]
slug      = "cli-process"
kind      = "feature"
title     = "Entire CLI process runner with discovery"
goal      = "Implement the one place that knows how to find, run and parse the Entire CLI, so that nothing else in the extension touches the process boundary. It owns every failure path: a missing binary, a broken binary, a timeout and a malformed response are all typed outcomes, never thrown errors."
depends_on = ["project-scaffold"]
hints = [
    "Discovery order: `entire` on PATH, then the documented install locations (`~/.local/bin`, `/usr/local/bin`, the XDG data dir, and the Windows equivalents).",
    "Cache the resolved path, but re-verify it cheaply so a CLI installed after activation is picked up.",
    "Run every invocation with a timeout and treat a timeout as 'the CLI is not usable', never as a hang.",
    "Capture stdout and stderr separately, and never merge them - the CLI's JSON goes to stdout and its diagnostics to stderr.",
    "Parse JSON from stdout with a strict schema; a CLI that emits a warning before its JSON must not break parsing.",
    "Expose the CLI's own `agent-help` output as structured usage, so callers never hardcode a flag list.",
    "Keep every filesystem and process concern in this module; the rest of the extension must not import `child_process`.",
]
test_hints = [
    "Unit tests against a fake CLI script that emits the real `status --json` and `session list --json` shapes.",
    "A test that the runner reports 'absent' when no binary exists, and 'broken' when one exists but exits non-zero.",
    "A test that a timeout is reported as a failure rather than hanging the suite.",
    "A test that a CLI printing a warning line before its JSON still parses.",
]
must_haves = [
    "Discovery distinguishes absent, present-and-working, and present-but-broken",
    "Every invocation is bounded by a timeout",
    "stdout and stderr are captured separately",
    "JSON parsing tolerates leading non-JSON output",
]
evaluation_criteria = [
    "No module outside src/services/cli imports child_process or fs for CLI access",
    "The runner never throws for a missing CLI; it returns a typed result",
    "Unit tests cover absent, broken, timing-out and warning-prefixed CLI cases",
    "The resolved CLI path is discoverable by other modules without re-running discovery",
]
implements = ["cli-discovery"]

# ─── Phase 2: Data Model ──────────────────────────────────────────────────────

[[phases]]
name  = "Data Model"
order = 2

[[phases.tasks]]
slug      = "domain-types"
kind      = "feature"
title     = "Entire data types and the JSON decode layer"
goal      = "Model the Entire CLI's JSON output as precise TypeScript types, with decoding that tolerates the nulls and shape variations the CLI actually emits."
depends_on = ["cli-process"]
hints = [
    "`status --json` has TWO different shapes and the difference is the crux of this task.",
    "Untracked: `{ enabled: false, agents: null, active_sessions: null, error: \"not a git repository\" }`.",
    "Tracked: `{ enabled: true, agents: [\"Copilot CLI\"], active_sessions: [{ agent, session_id, worktree_path, branch, status }], agent_help: \"entire agent-help\" }`.",
    "`agents` and `active_sessions` are ARRAYS when tracked and NULL when not. `error` appears only when untracked; `agent_help` only when tracked. A decoder must handle both, and must treat a non-null `error` as a state rather than a failure.",
    "`session list --json` returns an array of sessions with `session_id`, `agent`, `status`, `branch`, `worktree_path`, `started_at`, `last_active`, `turns`, `pending_turns`, `checkpoints` and `last_prompt`.",
    "`session current --json` adds a `resolution` field and may be absent when there is no current session.",
    "Decode into domain types, never into raw `any`. Use a discriminated result type so 'the CLI said no' and 'the CLI failed' stay distinguishable.",
    "Timestamps arrive as RFC 3339 strings with nanosecond precision; parse them to `Date` and keep the raw string for display.",
    "`branch` may be absent for a session that is not on a branch yet.",
    "Write the decoders as pure functions in `src/lib/` so they are testable without a process or an extension host.",
]
test_hints = [
    "Table-driven tests: one fixture per real CLI response shape, captured from the actual CLI.",
    "A test that the untracked `status --json` decodes to a distinct 'not a repository' state rather than a failure.",
    "A test that the tracked `status --json` decodes `agents` and `active_sessions` as populated arrays, not as the null shape.",
    "A test that a session missing `branch` and `last_prompt` still decodes.",
]
must_haves = [
    "Every CLI response has a corresponding TypeScript type and a decoder",
    "Decoders live in src/lib/ and import nothing from vscode",
    "The CLI's null fields are modelled as null or absent, not as empty strings",
    "Timestamps are parsed to Date with the raw value preserved",
]
evaluation_criteria = [
    "No `any` appears in the decode layer",
    "Decoders are pure functions with no I/O",
    "Tests cover every captured CLI response shape including the null-heavy status response",
    "A missing optional field never throws",
]

